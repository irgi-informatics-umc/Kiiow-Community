<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#111015"/>
  
  <!-- Subtle pixel grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#211D2A" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Left Card / Typography -->
  <rect x="80" y="80" width="600" height="470" fill="#191620" stroke="#383141" stroke-width="2"/>
  <rect x="80" y="80" width="600" height="6" fill="#9B7AFF"/>
  
  <text x="120" y="150" fill="#9B7AFF" font-family="monospace" font-size="18" letter-spacing="4">PIXEL EDITORIAL // STREAMER</text>
  <text x="120" y="240" fill="#FFFFFF" font-family="sans-serif" font-size="72" font-weight="bold">kiiow</text>
  <text x="120" y="310" fill="#C5B4FF" font-family="monospace" font-size="28">"support streamer kecil :o"</text>
  <text x="120" y="380" fill="#A29AAA" font-family="sans-serif" font-size="22">Ruang digital kiiow. Komunitas santai</text>
  <text x="120" y="415" fill="#A29AAA" font-family="sans-serif" font-size="22">pencinta Minecraft &amp; kreasi pixel.</text>

  <rect x="120" y="470" width="220" height="44" fill="#FFFFFF"/>
  <text x="140" y="498" fill="#111015" font-family="monospace" font-size="16" font-weight="bold">sociabuzz/kkiiiow</text>
  
  <rect x="360" y="470" width="200" height="44" fill="#211D2A" stroke="#383141" stroke-width="2"/>
  <text x="380" y="498" fill="#FFFFFF" font-family="monospace" font-size="16">tiktok @kk1iow</text>

  <!-- Large Pixel Cube Visual on Right -->
  <g transform="translate(800, 160) scale(2.2)">
    <!-- Top Face -->
    <polygon points="80,20 136,52 80,84 24,52" fill="#C5B4FF" />
    <polygon points="80,20 96,29 80,38 64,29" fill="#FFFFFF" />
    <polygon points="104,33 120,42 104,51 88,42" fill="#E8E2FF" />
    <polygon points="48,38 64,47 48,56 32,47" fill="#A288E8" />
    <polygon points="80,56 96,65 80,74 64,65" fill="#9B7AFF" />

    <!-- Left Face -->
    <polygon points="24,52 80,84 80,140 24,108" fill="#211D2A" />
    <polygon points="24,52 40,61 40,85 24,76" fill="#191620" />
    <polygon points="56,70 72,79 72,103 56,94" fill="#30293D" />

    <!-- Right Face -->
    <polygon points="80,84 136,52 136,108 80,140" fill="#3D334C" />
    <polygon points="88,61 104,52 104,76 88,85" fill="#4D4160" />
    <polygon points="104,90 120,81 120,105 104,114" fill="#2B2436" />

    <!-- Pixel eyes -->
    <rect x="52" y="80" width="8" height="8" fill="#FFFFFF" />
    <rect x="68" y="80" width="8" height="8" fill="#FFFFFF" />
    <rect x="54" y="82" width="4" height="4" fill="#111015" />
    <rect x="70" y="82" width="4" height="4" fill="#111015" />

    <!-- Wireframe Outline -->
    <polyline points="80,20 136,52 136,108 80,140 24,108 24,52 80,20" stroke="#9B7AFF" stroke-width="2" stroke-linejoin="round" />
    <line x1="80" y1="84" x2="80" y2="140" stroke="#9B7AFF" stroke-width="2" />
    <line x1="80" y1="84" x2="136" y2="52" stroke="#9B7AFF" stroke-width="2" />
    <line x1="80" y1="84" x2="24" y2="52" stroke="#9B7AFF" stroke-width="2" />
  </g>
</svg>

